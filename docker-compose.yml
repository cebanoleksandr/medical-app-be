services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deid
      POSTGRES_PASSWORD: deid
      POSTGRES_DB: deid
    ports:
      - '5440:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deid']
      interval: 5s
      retries: 10

  presidio:
    build: ./presidio
    environment:
      # Read from .env next to this file.
      PRESIDIO_API_KEY: ${PRESIDIO_API_KEY:?set PRESIDIO_API_KEY in .env}
    ports:
      - '5001:5001'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')",
        ]
      interval: 10s
      start_period: 30s
      retries: 10

volumes:
  pgdata:
